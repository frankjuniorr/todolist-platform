# ABOUTME: Ensina o External Secrets Operator a se autenticar no Vault.
# ABOUTME: A role e a policy do lado do Vault sao criadas pelo Ansible.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: todolist
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # Fala com o Service interno; nao passa pelo Ingress. Sem dependencia de
      # DNS externo, TLS ou Traefik para uma comunicacao dentro do cluster.
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "todolist"
          serviceAccountRef:
            name: external-secrets-vault
            namespace: todolist
