apiVersion: v1
kind: Namespace
metadata:
  name: todolist
  labels:
    # Pod Security Admission no nivel `restricted`: e o mais estrito, e a
    # aplicacao cabe nele porque roda como usuario nao-root com todas as
    # capabilities descartadas. Vale como evidencia de hardening.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
