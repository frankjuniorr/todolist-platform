apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todolist
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/frankjuniorr/todolist-platform.git
    targetRevision: main
    path: charts/todolist
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: todolist
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
  ignoreDifferences:
    # O HPA gerencia spec.replicas do Deployment. Se o Argo CD tambem gerenciar,
    # os dois brigam: o HPA escala para 4, o Argo CD ve diferenca em relacao ao
    # Git (2) e reverte, o HPA escala de novo. O Deployment nem declara replicas,
    # mas o campo aparece no objeto vivo, entao precisa ser ignorado explicitamente.
    - group: apps
      kind: Deployment
      jsonPointers: ["/spec/replicas"]
    # O webhook mutante do CNPG preenche dezenas de campos default em
    # spec/* que o nosso manifesto nunca declarou (afinidade, parametros de
    # tuning do postgresql.conf, monitoring, replicationSlots, os campos
    # extras que o operator adiciona em managed.roles[0] etc.). Sem isto, o
    # Cluster fica OutOfSync para sempre -- o mesmo problema do caBundle,
    # so que no CR do CNPG em vez de nos webhooks do cert-manager/ESO.
    # managedFieldsManagers nao resolve aqui: o webhook edita a requisicao
    # antes de chegar no etcd, entao TUDO fica atribuido ao manager que
    # aplicou (argocd-controller), sem um manager separado para excluir.
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /spec/affinity
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
        - /spec/enablePDB
        - /spec/failoverDelay
        - /spec/logLevel
        - /spec/managed
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/monitoring
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/postgresql
        - /spec/primaryUpdateMethod
        - /spec/replicationSlots
        - /spec/smartShutdownTimeout
        - /spec/startDelay
        - /spec/stopDelay
        - /spec/storage/resizeInUseVolumes
        - /spec/switchoverDelay
