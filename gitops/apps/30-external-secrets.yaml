apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      valuesObject:
        installCRDs: true
        # Espera os webhooks responderem antes de declarar a instalacao pronta.
        # Sem isso, o primeiro ExternalSecret e rejeitado com "connection refused"
        # porque o servico de webhook ainda nao tem endpoints.
        webhook:
          create: true
        resources:
          requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
