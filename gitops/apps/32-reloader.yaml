apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 1.2.0
    helm:
      valuesObject:
        reloader:
          # watchGlobally=false + anotacao explicita nos Deployments.
          # O modo `auto` reiniciaria qualquer workload cujo Secret mudasse,
          # inclusive os do proprio Argo CD -- efeito colateral indesejado.
          #
          # NAO adicionar namespaceSelector aqui: a Role/RoleBinding do chart
          # (Role namespaced, nao ClusterRole) ja restringe o Reloader a
          # enxergar Secrets/ConfigMaps soh no namespace onde ele roda -- o
          # isolamento que namespaceSelector tentaria promete ja esta feito.
          # Pior: Namespace e um recurso cluster-scoped, e uma Role NUNCA
          # consegue conceder list/watch sobre ele (RoleBinding+ClusterRole
          # tambem nao, por definicao do RBAC). Com namespaceSelector setado,
          # o Reloader tenta listar Namespaces pra casar o selector, recebe
          # Forbidden pra sempre, e o gate de "o namespace bate o selector?"
          # fica permanentemente falso -- reload nunca dispara, em silencio,
          # sem nenhum erro que aponte para isso na hora do rollout.
          watchGlobally: false
          deployment:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
            # O chart nao define isto por padrao (vem `{}`), e o namespace
            # `todolist` forca Pod Security "restricted" -- sem isto, todo
            # pod do Reloader e rejeitado na criacao (ReplicaFailure:
            # FailedCreate), nunca chega a existir para dar erro mais claro.
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: todolist
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
