apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 1.2.0
    helm:
      valuesObject:
        reloader:
          # watchGlobally=false + anotacao explicita nos Deployments.
          # O modo `auto` reiniciaria qualquer workload cujo Secret mudasse,
          # inclusive os do proprio Argo CD -- efeito colateral indesejado.
          watchGlobally: false
          namespaceSelector: todolist
          deployment:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: todolist
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
