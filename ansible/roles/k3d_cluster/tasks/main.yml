# ABOUTME: Cria o cluster k3d idempotentemente e publica 80/443 no load balancer.
---
- name: Listar clusters existentes
  ansible.builtin.command: k3d cluster list -o json
  changed_when: false
  register: _clusters

- name: Registrar se o cluster ja existe
  ansible.builtin.set_fact:
    cluster_exists: "{{ cluster_name in (_clusters.stdout | from_json | map(attribute='name') | list) }}"

- name: Criar o cluster k3d
  ansible.builtin.command:
    argv:
      - k3d
      - cluster
      - create
      - "{{ cluster_name }}"
      - --image={{ k3s_image }}
      - --servers=1
      - --agents={{ k3d_agents }}
      # Publicar 80/443 no serverlb e o que torna https://todolist.localhost
      # acessivel do navegador do host sem port-forward.
      - "--port={{ http_port }}:80@loadbalancer"
      - "--port={{ https_port }}:443@loadbalancer"
      # Nada de --disable=traefik: o Traefik embutido do k3s e usado como
      # esta. Instalar um segundo ingress controller faria os dois brigarem
      # pelo mesmo Service via helm-controller do k3s.
      - --wait
      - --timeout=300s
  when: not cluster_exists
  changed_when: true

- name: Aguardar os nodes ficarem Ready
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready nodes --all --timeout=180s
    --context k3d-{{ cluster_name }}
  changed_when: false

# O CoreDNS do k3s nasce com `forward . /etc/resolv.conf`, que dentro do
# container aponta para o proxy de DNS embutido do Docker. Em redes onde esse
# proxy nao responde -- ou onde o resolver real do host (roteador, AdGuardHome
# etc.) nao aceita consultas vindas da sub-rede do Docker -- toda resolucao de
# nome dentro do cluster trava. O sintoma so aparece bem mais tarde, no Argo CD
# ("dial tcp: lookup github.com ... server misbehaving"), longe da causa real.
# Fixar em resolvedores publicos e mais reprodutivel do que herdar o que o
# host tiver de configuracao de DNS -- o mesmo raciocinio que ja pina versao
# de k3s, chart, etc.
- name: Corrigir o CoreDNS para nao depender do resolv.conf do host
  ansible.builtin.shell: |
    set -euo pipefail
    CURRENT=$(kubectl --context k3d-{{ cluster_name }} -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}')
    FIXED=$(printf '%s' "$CURRENT" | sed 's#forward \. /etc/resolv\.conf#forward . 1.1.1.1 8.8.8.8#')
    PATCH=$(jq -n --arg corefile "$FIXED" '{"data":{"Corefile":$corefile}}')
    kubectl --context k3d-{{ cluster_name }} -n kube-system patch configmap coredns --type merge -p "$PATCH"
    kubectl --context k3d-{{ cluster_name }} -n kube-system rollout restart deployment coredns
    kubectl --context k3d-{{ cluster_name }} -n kube-system rollout status deployment coredns --timeout=60s
  args: { executable: /bin/bash }
  when: not cluster_exists
  changed_when: true

- name: Pre-carregar imagens criticas no cluster
  ansible.builtin.shell: |
    set -e
    docker pull {{ item }}
    k3d image import {{ item }} -c {{ cluster_name }}
  loop: "{{ prepull_images }}"
  when: not cluster_exists
  changed_when: true
  # O Docker Hub limita 100 pulls a cada 6h por IP anonimo. Com 4 nodes puxando
  # as mesmas imagens, um `just down && just up` algumas vezes no mesmo dia bate
  # no limite -- e o erro (`toomanyrequests`) aparece como ImagePullBackOff, que
  # parece problema de rede. Puxar uma vez no host e importar resolve.
