[defaults]
inventory = inventory/local.yml
roles_path = roles
host_key_checking = False
stdout_callback = yaml
bin_ansible_callbacks = True
# NAO aponta vault_password_file aqui: se apontasse, o ansible falha ao
# iniciar quando o arquivo nao existe -- mesmo sem nada para decifrar nesse
# run. E exatamente o oposto do que a promessa de "um comando sobe tudo" exige
# numa maquina limpa. A flag --vault-password-file e passada condicionalmente
# pelo Justfile, so quando o arquivo existe de verdade.
interpreter_python = auto_silent
retry_files_enabled = False
display_skipped_hosts = False

[inventory]
enable_plugins = yaml
