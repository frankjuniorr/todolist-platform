[defaults]
inventory = inventory/local.yml
roles_path = roles
host_key_checking = False
stdout_callback = yaml
bin_ansible_callbacks = True
# A senha do ansible-vault vem daqui quando o arquivo existe. Quando NAO existe,
# o playbook gera valores aleatorios em vez de parar num prompt -- e isso que
# preserva a promessa de "um comando sobe tudo" na maquina de quem avalia.
vault_password_file = ../.vault-pass
interpreter_python = auto_silent
retry_files_enabled = False
display_skipped_hosts = False

[inventory]
enable_plugins = yaml
