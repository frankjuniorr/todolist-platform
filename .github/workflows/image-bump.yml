# ABOUTME: Recebe o dispatch do repo da aplicacao e atualiza o digest no values.yaml.
# ABOUTME: E aqui que "atualizacao automatica da app" deixa de ser so GitOps.
name: image-bump

# O GitOps sozinho NAO resolve atualizacao automatica. O Argo CD garante que o
# cluster reflete o Git; ele nao decide que existe uma imagem nova. Alguem
# precisa escrever o digest novo no Git -- e esse alguem e este workflow.
on:
  repository_dispatch:
    types: [nova-imagem]
  workflow_dispatch:
    inputs:
      digest: { description: "sha256:...", required: true }

permissions:
  contents: write
  pull-requests: write

# Dois pushes na aplicacao em sequencia gerariam dois bumps concorrentes no
# mesmo arquivo. Serializar e mais barato que resolver conflito.
concurrency:
  group: image-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver o digest
        id: d
        run: ./scripts/image-bump-resolve-digest.sh "${{ github.event.client_payload.digest || inputs.digest }}"

      - name: Atualizar o values.yaml
        id: bump
        run: ./scripts/image-bump-update-values.sh "${{ steps.d.outputs.digest }}"

      - name: Abrir PR
        if: steps.bump.outputs.changed == 'true'
        env:
          # GITHUB_TOKEN de proposito, nao um PAT: pushes feitos com ele NAO
          # disparam `on: push`. E a prevencao de loop nativa do GitHub -- com um
          # PAT, este commit dispararia o proprio CI em cascata.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/image-bump-open-pr.sh "${{ steps.d.outputs.branch }}" "${{ steps.d.outputs.digest }}"
