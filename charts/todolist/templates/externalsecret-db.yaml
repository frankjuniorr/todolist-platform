{{- if .Values.postgres.enabled }}
{{/*
Secret das credenciais do banco, no formato que o CloudNativePG exige.

Precisa ser do tipo kubernetes.io/basic-auth com as chaves `username` e
`password`. O CNPG rejeita um Opaque aqui, e a mensagem de erro nao diz qual e
o tipo esperado.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "todolist.fullname" . }}-db
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "todolist.fullname" . }}-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/db, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/db, property: password }
{{- end }}
