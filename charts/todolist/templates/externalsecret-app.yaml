{{/*
Materializa o Secret da aplicacao a partir do Vault.

Este objeto e a razao de nenhum Secret do Kubernetes existir no Git. O que esta
versionado e de onde buscar, nunca o valor.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "todolist.fullname" . }}-app
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "todolist.fullname" . }}-app
    creationPolicy: Owner
    template:
      type: Opaque
      {{/* Sem template dinamico (nada de `now`, nada de random): se o conteudo
           renderizado mudasse a cada refresh, o Secret seria reescrito toda vez
           e o Reloader dispararia um rollout a cada refreshInterval. */}}
  data:
    - secretKey: SESSION_KEY
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/app, property: SESSION_KEY }
    - secretKey: ADMIN_USER
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/app, property: ADMIN_USER }
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/app, property: ADMIN_PASSWORD }
    - secretKey: CLEANUP_TOKEN
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/app, property: CLEANUP_TOKEN }
    - secretKey: DB_USER
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: {{ .Values.secrets.vaultPath }}/db, property: password }
