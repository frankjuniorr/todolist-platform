apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "todolist.fullname" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
{{/*
A app chama a API do Kubernetes com o token desta ServiceAccount para as telas
/pods e /cleanup/status. Varios baselines de hardening colocam
automountServiceAccountToken: false por padrao -- aqui isso quebraria as duas
telas sem erro visivel, porque a leitura do token e a mesma leitura de arquivo
que falha em silencio. Deixado explicito para nao virar "limpeza" depois.
*/}}
automountServiceAccountToken: true
